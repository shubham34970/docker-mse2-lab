services:
  web:
    build:
      context: .
    image: web-202401100100247:v1
    container_name: web-202401100100247
    ports:
      - "${HOST_PORT}:80"
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html
    environment:
      STUDENT_ROLL: ${ROLL_NO}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
